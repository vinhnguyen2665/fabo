server:
  port: 8080

spring:
  application:
    name: fabo-gateway
  cloud:
    gateway:
      routes:
        - id: pos-service-route
          uri: http://${POS_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/v1/pos/**
        - id: payment-service-route
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/v1/payments/**
        - id: kds-service-route
          uri: http://${KDS_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/v1/kds/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
