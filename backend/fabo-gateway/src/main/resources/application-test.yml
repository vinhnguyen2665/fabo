spring:
  config:
    activate:
      on-profile: test
  cloud:
    gateway:
      routes:
        - id: pos-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/pos/**
        - id: payment-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payments/**
        - id: kds-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/kds/**

logging:
  level:
    root: INFO
