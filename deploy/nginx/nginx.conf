events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstreams
    upstream gateway_upstream {
        server fabo-gateway:8080;
    }

    upstream kds_websocket_upstream {
        server fabo-kds-service:8083;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Apps Reverse Proxy
        location / {
            root /usr/share/nginx/html/pos-cashier;
            try_files $uri $uri/ /index.html;
        }

        location /kds {
            alias /usr/share/nginx/html/kds-kitchen;
            try_files $uri $uri/ /index.html;
        }

        location /admin {
            alias /usr/share/nginx/html/admin-portal;
            try_files $uri $uri/ /index.html;
        }

        location /order {
            alias /usr/share/nginx/html/customer-qr;
            try_files $uri $uri/ /index.html;
        }

        # API Gateway routing
        location /api/ {
            proxy_pass http://gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket STOMP for KDS
        location /ws-kds/ {
            proxy_pass http://kds_websocket_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
