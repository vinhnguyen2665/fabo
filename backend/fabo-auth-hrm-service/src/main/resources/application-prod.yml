spring:
  config:
    activate:
      on-profile: prod, product
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:fabo_hrm_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgrespassword}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:kafka:9092}

logging:
  level:
    root: WARN
    dev.c9tech.fabo: INFO
