spring:
  config:
    activate:
      on-profile: prod, product
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://${AUTH_SERVICE_HOST:fabo-auth-hrm-service}:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: hrm-service-route
          uri: http://${AUTH_SERVICE_HOST:fabo-auth-hrm-service}:8081
          predicates:
            - Path=/api/v1/hrm/**
        - id: pos-service-route
          uri: http://${POS_SERVICE_HOST:fabo-pos-service}:8082
          predicates:
            - Path=/api/v1/pos/**
        - id: kds-service-route
          uri: http://${KDS_SERVICE_HOST:fabo-kds-service}:8083
          predicates:
            - Path=/api/v1/kds/**
        - id: payment-service-route
          uri: http://${PAYMENT_SERVICE_HOST:fabo-payment-service}:8084
          predicates:
            - Path=/api/v1/payments/**
        - id: inventory-service-route
          uri: http://${INVENTORY_SERVICE_HOST:fabo-inventory-service}:8085
          predicates:
            - Path=/api/v1/inventory/**
        - id: finance-service-route
          uri: http://${FINANCE_SERVICE_HOST:fabo-finance-crm-service}:8086
          predicates:
            - Path=/api/v1/finance/**
        - id: kds-websocket-route
          uri: ws://${KDS_SERVICE_HOST:fabo-kds-service}:8083
          predicates:
            - Path=/ws-kds/**

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway: INFO
